<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Flamegraph</title>
    <style>
      html {
        box-sizing: border-box;
      }

      *,
      ::before,
      ::after {
        box-sizing: inherit;
      }

      body {
        margin: 0;
        padding: 24px;

        font:
          12px/1.2 Inter,
          Roboto,
          "Helvetica Neue",
          "Arial Nova",
          "Nimbus Sans",
          Arial,
          sans-serif;

        color: #2e3440;
        background: #fff;
      }

      canvas {
        display: block;

        margin-top: 1lh;

        width: 100%;
        aspect-ratio: 1;

        &[title] {
          cursor: pointer;
        }
      }
    </style>
  </head>

  <body id="viewer">
    <input id="file" type="file" />
    <canvas id="canvas"></canvas>
    <script type="module">
      const BAR_HEIGHT = 24;
      const BAR_GAP = 1;
      const ROW_HEIGHT = BAR_HEIGHT + BAR_GAP;

      const LABEL_PADDING = 6;
      const MIN_BAR_PX = 1;
      const ZOOM_DURATION = 200;

      /** Branches below this fraction of the root's visits are skipped during loading. */
      const SUBTREE_LOAD_THRESHOLD = 1 / 2160;

      const FONT = `12px/1.2 Inter, Roboto, "Helvetica Neue", "Arial Nova", "Nimbus Sans", Arial, sans-serif`;
      const FONT_FOCUSED = `bold ${FONT}`;

      /** The transition should be 99.9% done after `ZOOM_DURATION` ms. */
      const ZOOM_SPEED = -Math.log(1 - 0.999) / ZOOM_DURATION;

      /**
       * Control points for the Spectral color scale, sampled at equal intervals
       * and stored in Oklab for perceptually uniform interpolation.
       * Each entry is [L, a, b].
       *
       * @type {[number, number, number][]}
       */
      const SPECTRAL_OKLAB = [
        [0.4485, 0.1774, 0.0243],
        [0.5894, 0.1767, 0.0606],
        [0.6923, 0.1392, 0.1076],
        [0.8122, 0.0589, 0.1175],
        [0.9135, -0.0013, 0.1096],
        [0.9849, -0.0248, 0.0774],
        [0.9384, -0.052, 0.1056],
        [0.8479, -0.0732, 0.0581],
        [0.7489, -0.0974, 0.0157],
        [0.5995, -0.0571, -0.0989],
        [0.484, 0.0419, -0.1221],
      ];

      /**
       * A raw node as decoded from the binary file, before any
       * age stamp is applied by the loader.
       *
       * @typedef {{
       *   mov:    number,
       *   value:  number,
       *   visits: number,
       *   parent: number,
       *   head:   number,
       *   last:   number,
       * }} RawNode
       */

      /**
       * A raw node stamped with the age in which it was last fetched.
       *
       * @typedef {RawNode & { age: number }} Node
       */

      /**
       * A node in the world-space layout tree. Coordinates are in [0, 1].
       *
       * @typedef {{
       *   idx:      number,
       *   x0:       number,
       *   x1:       number,
       *   depth:    number,
       *   color:    string,
       *   label:    string,
       *   children: WorldNode[],
       * }} WorldNode
       */

      /**
       * A node in the screen-space layout tree. Coordinates are in CSS pixels.
       *
       * @typedef {{
       *   idx:      number,
       *   depth:    number,
       *   color:    string,
       *   label:    string,
       *   x:        number,
       *   y:        number,
       *   barWidth: number,
       *   children: ScreenNode[],
       * }} ScreenNode
       */

      document.addEventListener("DOMContentLoaded", () => {
        /** @type {HTMLCanvasElement} */
        const canvas = document.getElementById("canvas");
        /** @type {HTMLInputElement} */
        const picker = document.getElementById("file");

        picker.addEventListener("change", (/** @type {Event} */ e) => {
          const [file] = e.target.files;
          if (!file) {
            return;
          }

          main(file, canvas);
        });
      });

      /**
       * @param {File} file
       * @param {HTMLCanvasElement} canvas
       * @returns {Promise<void>}
       */
      async function main(file, canvas) {
        /** @type {number} */
        let canvasWidth = 0;

        /** @type {number} */
        let canvasHeight = 0;

        const ctx = canvas.getContext("2d");
        syncCanvasDims();

        const { archive, names } = await load(file);

        /** @type {Map<number, Node>} */
        let nodes = new Map();

        /** @type {WorldNode | null} Rebuilt per zoom. */
        let worldLayout = null;

        /** @type {ScreenNode | null} Rebuilt per frame. */
        let screenLayout = null;

        /** @type {number | null} */
        let animationHandle = null;

        /** @type {number} */
        let focused = 0;

        /** @type {number} */
        let viewMin = 0;
        /** @type {number} */
        let viewMax = 1;

        /** @type {number} */
        let age = 0;

        await focus(0);

        canvas.addEventListener("click", onClick);
        canvas.addEventListener("mousemove", onMouseMove);
        canvas.addEventListener("mouseleave", onMouseLeave);
        window.addEventListener("resize", onResize);

        /**
         * @param {number} target
         * @returns {Promise<void>}
         */
        async function focus(target) {
          nodes = await loadTree(target, archive, nodes, age);
          cancelAnimationFrame(animationHandle);

          focused = target;
          age += 1;

          worldLayout = buildWorldLayout(nodes, names);
          const [toMin, toMax] = findNodeRange(worldLayout, target);

          let start = performance.now();

          animationHandle = requestAnimationFrame(function frame() {
            const elapsed = performance.now() - start;
            start += elapsed;

            // See <https://lisyarus.github.io/blog/posts/exponential-smoothing.html>.
            viewMin += (toMin - viewMin) * (1 - Math.exp(-ZOOM_SPEED * elapsed));
            viewMax += (toMax - viewMax) * (1 - Math.exp(-ZOOM_SPEED * elapsed));

            if (
              Math.abs(toMin - viewMin) > Number.EPSILON ||
              Math.abs(toMax - viewMax) > Number.EPSILON
            ) {
              animationHandle = requestAnimationFrame(frame);
            }

            screenLayout = buildScreenLayout(
              worldLayout,
              [viewMin, viewMax],
              canvasWidth,
            );
            render(ctx, screenLayout, target, canvasWidth, canvasHeight);
          });
        }

        /** @returns {void} */
        function syncCanvasDims() {
          const dpr = window.devicePixelRatio || 1;
          const rect = canvas.getBoundingClientRect();

          canvas.width = rect.width * dpr;
          canvas.height = rect.height * dpr;

          ctx.scale(dpr, dpr);

          canvasWidth = rect.width;
          canvasHeight = rect.height;
        }

        /**
         * @param {MouseEvent} e
         * @returns {Promise<void>}
         */
        async function onClick(e) {
          if (!screenLayout) {
            return;
          }

          const { left, top } = canvas.getBoundingClientRect();
          const hit = hitTest(screenLayout, e.clientX - left, e.clientY - top);

          if (hit === null) {
            return;
          }

          await focus(hit);
        }

        /** @type {number | null} */
        let previousHover = null;

        /**
         * @param {MouseEvent} e
         * @returns {void}
         */
        function onMouseMove(e) {
          if (!screenLayout) {
            return;
          }

          const { left, top } = canvas.getBoundingClientRect();
          const hover = hitTest(screenLayout, e.clientX - left, e.clientY - top);

          if (hover === previousHover) {
            return;
          }

          previousHover = hover;

          if (hover === null) {
            canvas.removeAttribute("title");
            return;
          }

          const node = nodes.get(hover);

          const parentVisits =
            hover === 0 ? node.visits : nodes.get(node.parent).visits;
          const share = (100 * node.visits) / parentVisits;

          canvas.title = `${names[node.mov]}

Value: ${node.value.toFixed(3)}
Visits: ${node.visits} (${share.toFixed(1)}%)`;
        }

        /** @returns {void} */
        function onMouseLeave() {
          previousHover = null;

          canvas.removeAttribute("title");
        }

        /** @returns {void} */
        function onResize() {
          syncCanvasDims();

          if (!screenLayout) {
            return;
          }

          screenLayout = buildScreenLayout(
            worldLayout,
            [viewMin, viewMax],
            canvasWidth,
          );
          render(ctx, screenLayout, focused, canvasWidth, canvasHeight);
        }
      }

      /**
       * Stage 1 — Remote loading.
       *
       * Loads the minimal set of nodes needed to render the tree focused on
       * `focused`, in two phases:
       *
       *   Descend – load the focused subtree, skipping branches below
       *             SUBTREE_LOAD_THRESHOLD visits relative to the root.
       *
       *   Ascend  – walk back to the real root (idx 0), loading each ancestor
       *             and its direct children so the path above the focus renders.
       *
       * Starts from `cache` so already-loaded nodes are not re-fetched.
       * Each visited node is re-stamped with `age`; nodes more than one
       * generation old are pruned before returning.
       *
       * @param {number} focused
       * @param {ArchivedVec} archive
       * @param {Map<number, Node>} cache
       * @param {number} age
       * @returns {Promise<Map<number, Node>>}
       */
      async function loadTree(focused, archive, cache, age) {
        const nodes = new Map(cache);

        const root = await fetch(focused);
        const threshold = root.visits * SUBTREE_LOAD_THRESHOLD;

        await descend(focused);
        await ascend(focused);

        for (const [idx, node] of nodes) {
          if (node.age <= age - 2) {
            nodes.delete(idx);
          }
        }

        return nodes;

        async function fetch(idx) {
          const node = nodes.get(idx) ?? (await archive.load(idx));
          nodes.set(idx, { ...node, age });

          return node;
        }

        async function descend(idx) {
          const node = await fetch(idx);

          if (node.visits < threshold) {
            return;
          }

          for (const child of range(node.head, node.last)) {
            await descend(child);
          }
        }

        async function ascend(idx) {
          const node = await fetch(idx);

          for (const child of range(node.head, node.last)) {
            await fetch(child);
          }

          if (idx === 0) {
            return;
          }

          await ascend(node.parent);
        }
      }

      /**
       * Stage 2 — World-space layout.
       *
       * Builds a layout tree with world-space [x0, x1] coordinates in [0, 1],
       * where each node's width is proportional to its visit count.
       * Rebuilt per zoom, not per frame.
       *
       * @param {Map<number, Node>} nodes
       * @param {string[]} names
       * @returns {WorldNode}
       */
      function buildWorldLayout(nodes, names) {
        return visit(0, 0, 1, 0);

        function visit(idx, x0, x1, depth) {
          const node = nodes.get(idx);

          const label = names[node.mov];
          const [L, a, b] = interpolateSpectralOklab(1 - sigmoid(node.value));
          const color = `oklab(${L} ${a} ${b})`;

          const pairs = range(node.head, node.last)
            .map((i) => [i, nodes.get(i)])
            .filter(([, child]) => child != null);
          const sorted = Array.from(pairs).sort(
            ([, childA], [, childB]) => childB.visits - childA.visits,
          );

          let cursor = x0;
          let children = [];

          for (const [childIdx, child] of sorted) {
            const childWidth = (x1 - x0) * (child.visits / node.visits);

            const layout = visit(childIdx, cursor, cursor + childWidth, depth + 1);
            children.push(layout);

            cursor += childWidth;
          }

          return { idx, x0, x1, depth, color, label, children };
        }
      }

      /**
       * Returns the [x0, x1] world-space range of the node with `targetIdx`, or null.
       *
       * @param {WorldNode} node
       * @param {number} targetIdx
       * @returns {[number, number] | null}
       */
      function findNodeRange(node, targetIdx) {
        if (node.idx === targetIdx) {
          return [node.x0, node.x1];
        }

        for (const child of node.children) {
          const found = findNodeRange(child, targetIdx);
          if (found) {
            return found;
          }
        }

        return null;
      }

      /**
       * Stage 3 — Screen-space layout.
       *
       * Projects the world-space layout into a screen-space tree of the same shape,
       * culling nodes outside the viewport or below MIN_BAR_PX wide.
       *
       * Children spatially partition their parent's x interval (sorted left-to-right),
       * so hit testing can scan siblings at each level and recurse into exactly one child.
       *
       * @param {WorldNode} worldLayout
       * @param {[number, number]} viewport
       * @param {number} canvasWidth
       * @returns {ScreenNode | null}
       */
      function buildScreenLayout(worldLayout, [viewMin, viewMax], canvasWidth) {
        const scale = canvasWidth / (viewMax - viewMin);

        function visit(node) {
          if (node.x1 <= viewMin || node.x0 >= viewMax) {
            return null;
          }

          const barWidth = (node.x1 - node.x0) * scale - BAR_GAP;
          if (barWidth < MIN_BAR_PX) {
            return null;
          }

          const x = (node.x0 - viewMin) * scale;
          const y = node.depth * ROW_HEIGHT;

          const children = node.children.map(visit).filter(Boolean);

          return {
            idx: node.idx,
            depth: node.depth,
            color: node.color,
            label: node.label,
            x,
            y,
            barWidth,
            children,
          };
        }

        return visit(worldLayout);
      }

      /**
       * Stage 4a — Render.
       *
       * @param {CanvasRenderingContext2D} ctx
       * @param {ScreenNode} screenLayout
       * @param {number} focusIdx
       * @param {number} canvasWidth
       * @param {number} canvasHeight
       * @returns {void}
       */
      function render(ctx, screenLayout, focusIdx, canvasWidth, canvasHeight) {
        ctx.clearRect(0, 0, canvasWidth, canvasHeight);
        draw(screenLayout);

        function draw(node) {
          ctx.fillStyle = node.color;
          ctx.fillRect(node.x, node.y, node.barWidth, BAR_HEIGHT);

          const textLeft = Math.max(0, node.x) + LABEL_PADDING;
          const textRight =
            Math.min(canvasWidth, node.x + node.barWidth) - LABEL_PADDING;
          const textWidth = textRight - textLeft;

          if (textWidth > 0) {
            ctx.save();
            ctx.beginPath();
            ctx.rect(textLeft, node.y, textWidth, BAR_HEIGHT);
            ctx.clip();
            ctx.font = node.idx === focusIdx ? FONT_FOCUSED : FONT;
            ctx.textBaseline = "middle";
            ctx.fillStyle = "#2e3440";
            ctx.fillText(node.label, textLeft, node.y + BAR_HEIGHT / 2);
            ctx.restore();
          }

          for (const child of node.children) {
            draw(child);
          }
        }
      }

      /**
       * Stage 4b — Hit testing.
       *
       * Returns the idx of the node under (px, py), or null.
       * Scans children at each level (they partition the parent's x interval)
       * to find which one contains px, then recurses into it.
       *
       * @param {ScreenNode} node
       * @param {number} px
       * @param {number} py
       * @returns {number | null}
       */
      function hitTest(node, px, py) {
        const row = Math.floor(py / ROW_HEIGHT);
        if (row === node.depth) {
          return node.idx;
        }

        const child = node.children.find(
          (child) => px >= child.x && px < child.x + child.barWidth,
        );

        if (!child) {
          return null;
        }

        return hitTest(child, px, py);
      }

      // Data

      const FOOTER = -32;
      const STRIDE = 38;

      /**
       * @param {File} file
       * @returns {Promise<string[]>}
       */
      async function load(file) {
        const footer = new DataView(await file.slice(file.size + FOOTER).arrayBuffer());

        // region: Nodes

        const nodesPtr = Number(footer.getBigUint64(0, true));
        const nodesLen = Number(footer.getBigUint64(8, true));

        const nodesBuf = file.slice(nodesPtr, nodesPtr + nodesLen * STRIDE);
        const archive = new ArchivedVec(nodesBuf, nodesLen, 16 * 1024, 16 * 1024);

        // endregion
        // region: Names

        const namesPtr = Number(footer.getBigUint64(16, true));
        const namesLen = Number(footer.getBigUint64(24, true));

        const namesBuf = new DataView(
          await file.slice(namesPtr, namesPtr + namesLen * 16).arrayBuffer(),
        );

        const de = new TextDecoder();
        const names = await Promise.all(
          range(0, namesLen * 16, 16).map(async (offset) => {
            const strPtr = Number(namesBuf.getBigUint64(offset + 0, true));
            const strLen = Number(namesBuf.getBigUint64(offset + 8, true));

            const buf = await file.slice(strPtr, strPtr + strLen).arrayBuffer();
            const str = de.decode(buf);

            return str;
          }),
        );

        // endregion

        return { archive, names };
      }

      class ArchivedVec {
        /** @type {File} */
        file;

        /** @type {number} */
        count;

        /** @type {number} */
        pageSize;

        /** @type {Map<number, ArrayBuffer>} */
        pages;

        /** @type {number} */
        capacity;

        /** @type {Map<number, Promise<ArrayBuffer>>} */
        loads;

        /**
         * @param {File} file
         * @param {number} count
         * @param {number} pageSize
         * @param {number} capacity  Maximum number of pages to keep in memory.
         */
        constructor(file, count, pageSize, capacity) {
          this.file = file;
          this.count = count;
          this.pageSize = pageSize;
          this.pages = new Map();
          this.capacity = capacity;
          this.loads = new Map();
        }

        /**
         * @param {number} idx
         * @returns {Promise<RawNode>}
         */
        async load(idx) {
          const offset = STRIDE * idx;
          const pageStart = offset - (offset % this.pageSize);
          const pageEnd = pageStart + this.pageSize + STRIDE;

          let page = this.pages.get(pageStart);

          if (!page) {
            let load = this.loads.get(pageStart);

            if (!load) {
              load = this.file
                .slice(pageStart, pageEnd)
                .arrayBuffer()
                .then((buf) => {
                  this.pages.set(pageStart, buf);

                  if (this.pages.size > this.capacity) {
                    // Map preserves insertion order; this evicts the oldest page.
                    const evicted = this.pages.keys().next().value;
                    this.pages.delete(evicted);
                  }

                  return buf;
                })
                .finally(() => {
                  this.loads.delete(pageStart);
                });

              this.loads.set(pageStart, load);
            }

            page = await load;
          }

          const pageOffset = offset - pageStart;
          const view = new DataView(page.slice(pageOffset, pageOffset + STRIDE));

          // No padding: u16(2) + u32(4) + f64(8) + u64(8) + u64(8) + u64(8) = 38 bytes.
          return {
            mov: view.getUint16(0, true),
            visits: view.getUint32(2, true),
            value: view.getFloat64(6, true),
            parent: Number(view.getBigUint64(14, true)),
            head: Number(view.getBigUint64(22, true)),
            last: Number(view.getBigUint64(30, true)),
          };
        }
      }

      // Utils

      /**
       * Yields integers from `start` (inclusive) to `stop` (exclusive).
       *
       * @param {number} start
       * @param {number} stop
       * @param {number} [step=1]
       * @yields {number}
       */
      function* range(start, stop, step = 1) {
        while (start < stop) {
          yield start;
          start += step;
        }
      }

      /**
       * Standard logistic function, mapping any real number to (0, 1).
       *
       * @param {number} x
       * @returns {number}
       */
      function sigmoid(x) {
        return 1 / (1 + Math.exp(-x));
      }

      /**
       * Interpolates the Spectral color scale in Oklab at t ∈ [0, 1] using a
       * Catmull-Rom spline for smooth, perceptually uniform transitions.
       *
       * Returns an [L, a, b] triple suitable for use in CSS `oklab()`.
       *
       * @param {number} t
       * @returns {[number, number, number]}
       */
      function interpolateSpectralOklab(t) {
        const last = SPECTRAL_OKLAB.length - 1;
        const scaled = t * last;
        const index = Math.floor(scaled);
        const frac = scaled - index;

        const p0 = SPECTRAL_OKLAB[Math.max(0, index - 1)];
        const p1 = SPECTRAL_OKLAB[index];
        const p2 = SPECTRAL_OKLAB[Math.min(last, index + 1)];
        const p3 = SPECTRAL_OKLAB[Math.min(last, index + 2)];

        return [
          catmullRom(p0[0], p1[0], p2[0], p3[0], frac),
          catmullRom(p0[1], p1[1], p2[1], p3[1], frac),
          catmullRom(p0[2], p1[2], p2[2], p3[2], frac),
        ];
      }

      /**
       * Evaluates a Catmull-Rom spline at position t ∈ [0, 1] given four
       * scalar control points p0…p3, where p1 and p2 are the segment endpoints.
       *
       * @param {number} p0
       * @param {number} p1
       * @param {number} p2
       * @param {number} p3
       * @param {number} t
       * @returns {number}
       */
      function catmullRom(p0, p1, p2, p3, t) {
        const t2 = t * t;
        const t3 = t2 * t;
        return (
          0.5 *
          (2 * p1 +
            (-p0 + p2) * t +
            (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 +
            (-p0 + 3 * p1 - 3 * p2 + p3) * t3)
        );
      }
    </script>
  </body>
</html>
